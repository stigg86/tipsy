name: Probe Big Balls (manual)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node scripts/probe-bbs.mjs
        env:
          BIGBALLS_KEY: ${{ secrets.BIGBALLS_KEY }}
