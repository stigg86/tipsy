name: Update tips

on:
  schedule:
    - cron: "15 6 * * *"        # every day, 06:15 UTC
    - cron: "15 11 * * 5,6,0,1"  # Fri–Mon late morning, for fresher team news
  workflow_dispatch: {}          # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: update-tips
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build data
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          LEAGUES: ${{ vars.LEAGUES }}
          SEASON: ${{ vars.SEASON }}
          MIN_LEFT: ${{ vars.MIN_LEFT }}
        run: node scripts/build.mjs

      - name: Commit if changed
        run: |
          git config user.name "tipsy-bot"
          git config user.email "tipsy-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update tips data"
          git push
