name: Update tips

on:
  schedule:
    - cron: "15 6 * * *"        # every day, 06:15 UTC
    - cron: "15 11 * * 5,6,0,1"  # Fri–Mon late morning, for fresher team news
  workflow_dispatch: {}          # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: update-tips
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build data
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          LEAGUES: ${{ vars.LEAGUES }}
          PROBE_LALIGA: ${{ vars.PROBE_LALIGA || '1' }}
        run: node scripts/build.mjs

      - name: Commit if changed
        run: |
          git config user.name "tipsy-bot"
          git config user.email "tipsy-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update tips data"
          git push
