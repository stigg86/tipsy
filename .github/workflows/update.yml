name: Update tips

on:
  schedule:
    - cron: "15 */3 * * *"      # every 3 hours: GitHub often starts scheduled jobs hours late, so run often
                                 # (odds, bet365 and other paid-for calls have their own refresh limits)
  workflow_dispatch:             # "Run workflow" button on the Actions tab
    inputs:
      force_odds:
        description: "Refresh bookmaker odds even if under 6 hours old"
        required: false
        default: "false"
      force_all:
        description: "Refresh all-sports best bets even if under 20 hours old (uses ~6 of 250 monthly OddsPapi requests)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: update-tips
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build data
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          BIGBALLS_KEY: ${{ secrets.BIGBALLS_KEY }}
          LEAGUES: ${{ vars.LEAGUES }}
          FORCE_ODDS: ${{ github.event.inputs.force_odds == 'true' && '1' || '' }}
        run: node scripts/build.mjs

      - name: All-sports best bets (once a day)
        continue-on-error: true
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          FORCE_ALLSPORTS: ${{ github.event.inputs.force_all == 'true' && '1' || '' }}
        run: node scripts/allsports.mjs

      - name: Commit if changed
        run: |
          git config user.name "tipsy-bot"
          git config user.email "tipsy-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update tips data"
          git push
